name: AI Engineering Daily

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: do not post to Slack"
        type: boolean
        default: true
      bulletin:
        description: "Which bulletin to run"
        type: choice
        options:
          - ai-daily
          - websec
          - both
        default: both

permissions:
  contents: write   # commit the state files (duplicate protection)

concurrency:
  group: ai-eng-daily
  cancel-in-progress: false

env:
  BULLETIN: ${{ inputs.bulletin || 'both' }}
  POSTS_FOR_REAL: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test validator
        run: python -m unittest discover -s tests -v

      - name: Run AI Engineering Daily
        id: ai_daily
        if: env.BULLETIN != 'websec'
        timeout-minutes: 10
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_EFFORT: ${{ vars.LLM_EFFORT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0C3C2EJATZ' }}
          SLACK_ALLOWED_CHANNELS: ${{ vars.SLACK_ALLOWED_CHANNELS || 'C0C3C2EJATZ' }}
        run: |
          if [ "$POSTS_FOR_REAL" = "true" ]; then
            python -m app.main --profile ai-daily
          else
            python -m app.main --profile ai-daily --dry-run
          fi
      - name: Alert on AI Engineering Daily failure
        if: failure() && steps.ai_daily.outcome == 'failure' && env.POSTS_FOR_REAL == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0C3C2EJATZ' }}
          ALERT_CHANNEL_ID: ${{ vars.ALERT_CHANNEL_ID || 'C0C5RGC88SX' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m app.alert

      # Runs even when the first bulletin failed, so one failure never blocks the other.
      - name: Run Tech Stack Security Daily
        id: websec
        if: ${{ !cancelled() && env.BULLETIN != 'ai-daily' }}
        timeout-minutes: 10
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_EFFORT: ${{ vars.LLM_EFFORT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0C3C2EJATZ' }}
          SLACK_ALLOWED_CHANNELS: ${{ vars.SLACK_ALLOWED_CHANNELS || 'C0C3C2EJATZ' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$POSTS_FOR_REAL" = "true" ]; then
            python -m app.main --profile websec
          else
            python -m app.main --profile websec --dry-run
          fi
      - name: Alert on Tech Stack Security Daily failure
        if: failure() && steps.websec.outcome == 'failure' && env.POSTS_FOR_REAL == 'true'
        env:
          BULLETIN_NAME: Tech Stack Security Daily
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID || 'C0C3C2EJATZ' }}
          ALERT_CHANNEL_ID: ${{ vars.ALERT_CHANNEL_ID || 'C0C5RGC88SX' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m app.alert

      # Save state even if one bulletin failed after the other had posted.
      - name: Save duplicate-protection state
        if: ${{ !cancelled() && env.POSTS_FOR_REAL == 'true' }}
        run: |
          git config user.name "ai-eng-daily-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add state/posted.json state/posted-websec.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update posted state [skip ci]" && git pull --rebase && git push)
